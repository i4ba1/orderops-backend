name: Verify backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, PostgreSQL and Kafka integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Carrier simulator tests
        run: node --test tools/carrier-simulator/test/server.test.mjs
      - name: Validate local environment
        run: docker compose --env-file .env.example -f infra/compose.yaml --profile apps config --quiet
      - name: Build backend images
        run: docker compose --env-file .env.example -f infra/compose.yaml --profile apps build order-service fulfillment-service carrier-simulator
      - name: Package backend release
        run: |
          mkdir -p dist
          tar --exclude='*/.env*' --exclude='*/node_modules' \
            -czf dist/orderops-${{ github.sha }}.tar.gz infra tools contracts docs README.md \
            services/order-service/target/order-service-0.1.0-SNAPSHOT.jar \
            services/fulfillment-service/target/fulfillment-service-0.1.0-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: orderops-backend-release
          path: dist/orderops-*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
