name: orderops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${ORDEROPS_POSTGRES_ADMIN_PASSWORD:?Set the local database admin password}
      ORDEROPS_DATABASE_PASSWORD: ${ORDEROPS_DATABASE_PASSWORD:?Set the order database password}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:?Set the fulfillment database password}
    ports:
      - "127.0.0.1:${ORDEROPS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro

  carrier-simulator:
    build:
      context: ../tools/carrier-simulator
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      CARRIER_DATA_FILE: /data/state.json
    volumes:
      - carrier-data:/data
    ports:
      - "127.0.0.1:8090:8090"

  order-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: order-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      ORDEROPS_DATABASE_URL: jdbc:postgresql://postgres:5432/orders
      ORDEROPS_DATABASE_USERNAME: orders
      ORDEROPS_DATABASE_PASSWORD: ${ORDEROPS_DATABASE_PASSWORD:?Set the order database password}
      ORDEROPS_OPERATOR_PASSWORD: ${ORDEROPS_OPERATOR_PASSWORD:?Set the operator password}
      ORDEROPS_VIEWER_PASSWORD: ${ORDEROPS_VIEWER_PASSWORD:?Set the viewer password}
      ORDEROPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  fulfillment-service:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: fulfillment-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      FULFILLMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/fulfillment
      FULFILLMENT_DATABASE_USERNAME: fulfillment
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:?Set the fulfillment database password}
      ORDEROPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CARRIER_BASE_URL: http://carrier-simulator:8090
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    mem_limit: 768m
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      carrier-simulator:
        condition: service_healthy

  web:
    profiles: ["apps"]
    image: ${ORDEROPS_FRONTEND_IMAGE:-orderops-frontend:local}
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      order-service:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
  carrier-data:
